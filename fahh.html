<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.Tech CSE Semester 1 Mathematics - Practice Test</title>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-card: #1a1a3e;
            --bg-card-hover: #222250;
            --text-primary: #e0e0ff;
            --text-secondary: #a0a0cc;
            --accent: #6c63ff;
            --accent-light: #8b82ff;
            --correct: #00c853;
            --correct-bg: rgba(0, 200, 83, 0.1);
            --wrong: #ff1744;
            --wrong-bg: rgba(255, 23, 68, 0.1);
            --border: #2a2a5a;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --glow: 0 0 20px rgba(108, 99, 255, 0.3);
            --radius: 16px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at top left, rgba(108, 99, 255, 0.15), transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(108, 99, 255, 0.1), transparent 50%);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            margin-bottom: 30px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
        }

        header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #6c63ff, #ff6ec7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        header .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .score-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 12px 24px;
            box-shadow: var(--shadow);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(20px);
            transition: var(--transition);
        }

        .score-bar:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow);
        }

        .score-bar .score-num {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-light);
        }

        .score-bar .score-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .question-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .question-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6c63ff, #ff6ec7, #6c63ff);
            background-size: 200% 100%;
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 0%; }
            50% { background-position: 100% 0%; }
        }

        .question-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow);
            border-color: var(--accent);
        }

        .question-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
        }

        .question-number {
            background: linear-gradient(135deg, var(--accent), #ff6ec7);
            color: white;
            font-weight: bold;
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 50px;
            white-space: nowrap;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .question-text {
            font-size: 1.05rem;
            color: var(--text-primary);
            flex: 1;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .option {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.95rem;
            color: var(--text-secondary);
            position: relative;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option:hover {
            border-color: var(--accent);
            background: var(--bg-card-hover);
            color: var(--text-primary);
            transform: scale(1.02);
        }

        .option.selected {
            border-color: var(--accent);
            background: var(--bg-card-hover);
            color: var(--text-primary);
            box-shadow: 0 0 15px rgba(108, 99, 255, 0.2);
        }

        .option.correct {
            border-color: var(--correct) !important;
            background: var(--correct-bg) !important;
            color: var(--correct) !important;
            box-shadow: 0 0 20px rgba(0, 200, 83, 0.3) !important;
            animation: correctPulse 0.6s ease;
        }

        .option.wrong {
            border-color: var(--wrong) !important;
            background: var(--wrong-bg) !important;
            color: var(--wrong) !important;
            box-shadow: 0 0 20px rgba(255, 23, 68, 0.3) !important;
            animation: wrongShake 0.5s ease;
        }

        .option.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .option .option-label {
            font-weight: bold;
            color: var(--accent-light);
            flex-shrink: 0;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border-radius: 50%;
            font-size: 0.85rem;
            border: 1px solid var(--border);
        }

        .check-btn {
            background: linear-gradient(135deg, var(--accent), #ff6ec7);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: var(--transition);
            margin-top: 15px;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .check-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 99, 255, 0.4);
        }

        .check-btn:active {
            transform: translateY(0);
        }

        .check-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .answer-section {
            display: none;
            margin-top: 15px;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            border-left: 4px solid var(--accent);
            animation: slideDown 0.5s ease;
        }

        .answer-section.show {
            display: block;
        }

        .answer-section.correct-answer {
            border-left-color: var(--correct);
            background: var(--correct-bg);
        }

        .answer-section.wrong-answer {
            border-left-color: var(--wrong);
            background: var(--wrong-bg);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .answer-section h4 {
            color: var(--accent-light);
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .answer-section p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .chapter-divider {
            text-align: center;
            margin: 40px 0;
            position: relative;
        }

        .chapter-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
        }

        .chapter-divider span {
            background: var(--bg-primary);
            padding: 8px 20px;
            color: var(--accent-light);
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
            border: 1px solid var(--border);
            border-radius: 50px;
        }

        .final-score-section {
            text-align: center;
            padding: 30px;
            background: var(--bg-card);
            border-radius: var(--radius);
            margin-top: 30px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .final-score-section h2 {
            font-size: 1.5rem;
            color: var(--accent-light);
            margin-bottom: 10px;
        }

        .final-score {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #6c63ff, #ff6ec7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .reset-btn {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent-light);
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: var(--transition);
            margin-top: 20px;
        }

        .reset-btn:hover {
            background: var(--accent);
            color: white;
            box-shadow: var(--glow);
        }

        @media (max-width: 768px) {
            .options {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.5rem;
            }

            .score-bar {
                top: 10px;
                right: 10px;
                padding: 8px 16px;
            }

            .score-bar .score-num {
                font-size: 1.2rem;
            }

            .container {
                padding: 10px;
            }

            .question-card {
                padding: 18px;
            }
        }

        @media (max-width: 480px) {
            .question-card {
                padding: 14px;
            }

            .option {
                padding: 10px 14px;
                font-size: 0.85rem;
            }

            .check-btn {
                padding: 10px 20px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="score-bar">
        <span class="score-num" id="scoreDisplay">0</span>
        <span class="score-label">/ 75</span>
    </div>

    <div class="container">
        <header>
            <h1>B.Tech CSE Semester 1 Mathematics</h1>
            <div class="subtitle">Practice Test - Sets, Relations, Functions, Trigonometry & Coordinate Geometry</div>
        </header>

        <div id="quizContainer"></div>

        <div class="final-score-section" id="finalScoreSection" style="display:none;">
            <h2>Test Complete!</h2>
            <div class="final-score" id="finalScore">0</div>
            <p style="color: var(--text-secondary); margin-top: 10px;">out of 75 questions</p>
            <button class="reset-btn" onclick="resetQuiz()">Reset Quiz</button>
        </div>
    </div>

    <script>
        const quizData = [
            // Chapter 1: Sets, Relations, and Functions
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section A: Sets & Power Sets",
                question: "If a set A has n elements, determine the number of proper non-empty subsets of A.",
                options: ["2ⁿ - 1", "2ⁿ - 2", "2ⁿ + 1", "2ⁿ"],
                correct: 1,
                answer: "Total subsets = 2ⁿ. Proper subsets = 2ⁿ - 1. Excluding empty set: 2ⁿ - 2."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section A: Sets & Power Sets",
                question: "For two sets A and B, if |A| = 4 and |B| = 6, find the maximum possible value of |A ∪ B|.",
                options: ["4", "6", "10", "24"],
                correct: 2,
                answer: "Maximum occurs when A and B are disjoint: |A ∪ B| = |A| + |B| = 4 + 6 = 10."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section A: Sets & Power Sets",
                question: "For two sets A and B, if |A| = 4 and |B| = 6, find the minimum possible value of |A ∪ B|.",
                options: ["4", "6", "10", "2"],
                correct: 1,
                answer: "Minimum occurs when one set is subset of other: |A ∪ B| = max(|A|, |B|) = 6."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section A: Sets & Power Sets",
                question: "Let A = {1, 2, 3}. What is the cardinality of P(P(A))?",
                options: ["8", "64", "256", "16"],
                correct: 2,
                answer: "|A| = 3, so |P(A)| = 2³ = 8. Then |P(P(A))| = 2⁸ = 256."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section A: Sets & Power Sets",
                question: "In a class of 100 CSE students, 65 like Python, 45 like C++, and 20 like both. How many students like neither language?",
                options: ["10", "20", "30", "5"],
                correct: 0,
                answer: "|P ∪ C| = 65 + 45 - 20 = 90. Neither = 100 - 90 = 10."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section A: Sets & Power Sets",
                question: "If P(A) = P(B), which of the following is necessarily true?",
                options: ["A ⊆ B only", "B ⊆ A only", "A = B", "A ∩ B = ∅"],
                correct: 2,
                answer: "If power sets are equal, then A ∈ P(B) and B ∈ P(A), implying A ⊆ B and B ⊆ A, so A = B."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section A: Sets & Power Sets",
                question: "Let Aᵢ = {1, 2, 3, ..., i}. Find ⋃ᵢ₌₁ⁿ Aᵢ.",
                options: ["{1}", "{1, 2, ..., n}", "∅", "{n}"],
                correct: 1,
                answer: "The sets are nested, so the union is the largest set Aₙ = {1, 2, ..., n}."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section A: Sets & Power Sets",
                question: "Let Aᵢ = {1, 2, 3, ..., i}. Find ⋂ᵢ₌₁ⁿ Aᵢ.",
                options: ["{1}", "{1, 2, ..., n}", "∅", "{n}"],
                correct: 0,
                answer: "The intersection of nested sets is the smallest set A₁ = {1}."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section A: Sets & Power Sets",
                question: "Express the symmetric difference A Δ B in terms of union and intersection.",
                options: ["(A ∪ B) ∩ (A ∩ B)", "(A ∪ B) \\ (A ∩ B)", "(A \\ B) ∩ (B \\ A)", "A ∪ B"],
                correct: 1,
                answer: "A Δ B = (A \\ B) ∪ (B \\ A) = (A ∪ B) \\ (A ∩ B)."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section B: Relations & Equivalence",
                question: "Let R be a relation on ℤ defined by xRy ⟺ x - y is divisible by 5. How many equivalence classes does R have?",
                options: ["1", "5", "10", "Infinite"],
                correct: 1,
                answer: "The equivalence classes are [0], [1], [2], [3], [4] based on remainder mod 5."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section B: Relations & Equivalence",
                question: "Which relation on S = {1, 2, 3, 4} is symmetric and transitive but NOT reflexive?",
                options: ["{(1,1), (2,2), (3,3), (4,4)}", "{(1,1), (2,2)}", "{(1,2), (2,1)}", "{(1,1), (1,2)}"],
                correct: 1,
                answer: "{(1,1), (2,2)} is symmetric and transitive but missing (3,3) and (4,4), so not reflexive."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section B: Relations & Equivalence",
                question: "If R and S are equivalence relations on set A, which is always an equivalence relation?",
                options: ["R ∪ S", "R \\ S", "R ∩ S", "A × A \\ R"],
                correct: 2,
                answer: "R ∩ S is always reflexive, symmetric, and transitive. R ∪ S may fail transitivity."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section B: Relations & Equivalence",
                question: "Find the total number of relations on a set A with n elements.",
                options: ["2ⁿ", "2ⁿ²", "n²", "n!"],
                correct: 1,
                answer: "A relation is a subset of A × A. |A × A| = n². Total relations = 2ⁿ²."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section B: Relations & Equivalence",
                question: "How many reflexive relations are there on a set with n elements?",
                options: ["2ⁿ²", "2ⁿ²⁻ⁿ", "2ⁿ²⁺ⁿ", "n²"],
                correct: 1,
                answer: "Reflexive relations must contain all n diagonal pairs. Remaining n² - n pairs: 2ⁿ²⁻ⁿ."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section B: Relations & Equivalence",
                question: "For R = {(1,2), (2,3), (3,1)} on A = {1,2,3}, what is the symmetric closure?",
                options: ["{(1,2),(2,3),(3,1)}", "{(1,2),(2,1),(2,3),(3,2),(3,1),(1,3)}", "{(1,1),(2,2),(3,3)}", "A × A"],
                correct: 1,
                answer: "Symmetric closure adds (b,a) for every (a,b) in R."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section B: Relations & Equivalence",
                question: "For R = {(1,2), (2,3), (3,1)}, what is the transitive closure of R?",
                options: ["{(1,2),(2,3),(3,1)}", "{(1,2),(2,3),(3,1),(1,3),(2,1),(3,2)}", "A × A", "∅"],
                correct: 2,
                answer: "The transitive closure of this cyclic relation is the complete relation A × A."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section B: Relations & Equivalence",
                question: "Let (a,b) R (c,d) ⟺ a² + b² = c² + d² on ℝ×ℝ. What is the equivalence class of (3,4)?",
                options: ["A point", "A line", "A circle of radius 5", "A parabola"],
                correct: 2,
                answer: "The equivalence class is the set of all (x,y) with x² + y² = 25, which is a circle of radius 5."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section B: Relations & Equivalence",
                question: "If |A| = m and |B| = n, how many relations can be defined from A to B?",
                options: ["2ᵐⁿ", "mⁿ", "nᵐ", "2ᵐ⁺ⁿ"],
                correct: 0,
                answer: "A relation from A to B is a subset of A × B. |A × B| = mn, so total relations = 2ᵐⁿ."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section B: Relations & Equivalence",
                question: "The relation 'a divides b' on ℤ⁺ is:",
                options: ["Equivalence relation", "Partial order", "Neither", "Both"],
                correct: 1,
                answer: "It is reflexive, anti-symmetric, and transitive, so it is a partial order. Not symmetric."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section C: Functions & Mappings",
                question: "Find the domain of f(x) = √((x-1)/(4-x)).",
                options: ["[1, 4)", "(1, 4]", "(-∞, 1] ∪ (4, ∞)", "[1, 4]"],
                correct: 0,
                answer: "Need (x-1)/(4-x) ≥ 0 and x ≠ 4. Critical points at x = 1 and x = 4. Domain is [1, 4)."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section C: Functions & Mappings",
                question: "Find the range of f(x) = √((x-1)/(4-x)).",
                options: ["[0, ∞)", "(0, ∞)", "[0, 1]", "ℝ"],
                correct: 0,
                answer: "As x→1⁺, f(x)→0. As x→4⁻, f(x)→∞. Range is [0, ∞)."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section C: Functions & Mappings",
                question: "For f(x) = (x-3)/(x-2), find f⁻¹(x).",
                options: ["(2x-3)/(x-1)", "(x-3)/(x-2)", "(2x+3)/(x+1)", "1/(x-2)"],
                correct: 0,
                answer: "Solve y = (x-3)/(x-2) for x: x = (2y-3)/(y-1). So f⁻¹(x) = (2x-3)/(x-1)."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section C: Functions & Mappings",
                question: "Find the domain of f(x) = 1/(3 - cos 2x).",
                options: ["ℝ", "ℝ \\ {0}", "(-∞, 3)", "(0, ∞)"],
                correct: 0,
                answer: "Since -1 ≤ cos 2x ≤ 1, 2 ≤ 3 - cos 2x ≤ 4. Denominator is never zero. Domain = ℝ."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section C: Functions & Mappings",
                question: "Is f(x) = x² + 2x + 3 injective?",
                options: ["Yes", "No", "Only on [0, ∞)", "Only on (-∞, 0]"],
                correct: 1,
                answer: "f(x) = (x+1)² + 2. f(-2) = 3 and f(0) = 3. Different inputs, same output. Not injective."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section C: Functions & Mappings",
                question: "How many bijective functions exist from a set with n elements to itself?",
                options: ["n", "n²", "2ⁿ", "n!"],
                correct: 3,
                answer: "A bijective function from A to A is a permutation. There are n! permutations."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section C: Functions & Mappings",
                question: "If f(x) = ln((1+x)/(1-x)), what is f(2x/(1+x²)) equal to?",
                options: ["f(x)", "2f(x)", "f(2x)", "4f(x)"],
                correct: 1,
                answer: "f(2x/(1+x²)) = ln((1+x)²/(1-x)²) = 2ln((1+x)/(1-x)) = 2f(x)."
            },
            {
                chapter: "Chapter 1: Sets, Relations, and Functions",
                section: "Section C: Functions & Mappings",
                question: "For x = -3.7, what is ⌊x⌋ and ⌈x⌉ respectively?",
                options: ["-4, -3", "-3, -4", "-3, -3", "-4, -4"],
                correct: 0,
                answer: "Floor of -3.7 is -4 (largest integer ≤ -3.7). Ceiling is -3 (smallest integer ≥ -3.7)."
            },

        let score = 0;
        let answeredQuestions = new Set();

        function createQuiz() {
            const container = document.getElementById('quizContainer');
            let currentChapter = '';
            let currentSection = '';
            let html = '';

            quizData.forEach((q, index) => {
                if (q.chapter !== currentChapter) {
                    currentChapter = q.chapter;
                    html += `<div class="chapter-divider"><span>${q.chapter}</span></div>`;
                }
                if (q.section !== currentSection || q.chapter !== currentChapter) {
                    currentSection = q.section;
                }

                html += `
                    <div class="question-card" id="question-${index}">
                        <div class="question-header">
                            <div class="question-number">Q${index + 1}</div>
                            <div class="question-text"><strong>${q.section}:</strong> ${q.question}</div>
                        </div>
                        <div class="options" id="options-${index}">
                            ${q.options.map((opt, optIndex) => `
                                <div class="option" id="opt-${index}-${optIndex}" onclick="selectOption(${index}, ${optIndex})">
                                    <span class="option-label">${String.fromCharCode(65 + optIndex)}</span>
                                    <span>${opt}</span>
                                </div>
                            `).join('')}
                        </div>
                        <button class="check-btn" id="checkBtn-${index}" onclick="checkAnswer(${index})">CHECK ANSWER</button>
                        <div class="answer-section" id="answer-${index}">
                            <h4>Detailed Solution</h4>
                            <p>${q.answer}</p>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function selectOption(qIndex, optIndex) {
            if (answeredQuestions.has(qIndex)) return;

            const options = document.querySelectorAll(`#options-${qIndex} .option`);
            options.forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === optIndex) {
                    opt.classList.add('selected');
                }
            });
        }

        function checkAnswer(qIndex) {
            if (answeredQuestions.has(qIndex)) {
                return;
            }

            const selected = document.querySelector(`#options-${qIndex} .option.selected`);
            if (!selected) {
                alert('Please select an option first!');
                return;
            }

            const correctIndex = quizData[qIndex].correct;
            const options = document.querySelectorAll(`#options-${qIndex} .option`);
            const answerSection = document.getElementById(`answer-${qIndex}`);
            const checkBtn = document.getElementById(`checkBtn-${qIndex}`);

            options.forEach((opt, i) => {
                opt.classList.add('disabled');
                if (i === correctIndex) {
                    opt.classList.add('correct');
                }
                if (i !== correctIndex && opt.classList.contains('selected')) {
                    opt.classList.add('wrong');
                }
            });

            const isCorrect = selected.textContent.includes(quizData[qIndex].options[correctIndex]);
            if (isCorrect) {
                score++;
                answerSection.classList.add('correct-answer');
            } else {
                answerSection.classList.add('wrong-answer');
            }

            answerSection.classList.add('show');
            checkBtn.disabled = true;
            checkBtn.textContent = isCorrect ? '✓ CORRECT!' : '✗ WRONG!';
            
            if (isCorrect) {
                checkBtn.style.background = 'linear-gradient(135deg, #00c853, #69f0ae)';
            } else {
                checkBtn.style.background = 'linear-gradient(135deg, #ff1744, #ff6ec7)';
            }

            answeredQuestions.add(qIndex);
            document.getElementById('scoreDisplay').textContent = score;

            if (answeredQuestions.size === quizData.length) {
                showFinalScore();
            }
        }

        function showFinalScore() {
            const finalSection = document.getElementById('finalScoreSection');
            const finalScoreEl = document.getElementById('finalScore');
            finalSection.style.display = 'block';
            finalScoreEl.textContent = score;
            finalSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function resetQuiz() {
            score = 0;
            answeredQuestions.clear();
            document.getElementById('scoreDisplay').textContent = 0;
            document.getElementById('finalScoreSection').style.display = 'none';
            createQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize quiz
        createQuiz();
